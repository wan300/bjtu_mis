server {
    listen 80;
    listen [::]:80;
    server_name bjtu.cc www.bjtu.cc;

    root /var/www/bjtu.cc/current;
    index index.html;

    access_log /var/log/nginx/bjtu.cc.access.log;
    error_log /var/log/nginx/bjtu.cc.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bjtu.cc www.bjtu.cc;

    root /var/www/bjtu.cc/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/bjtu.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bjtu.cc/privkey.pem;

    access_log /var/log/nginx/bjtu.cc.ssl.access.log;
    error_log /var/log/nginx/bjtu.cc.ssl.error.log;

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:15020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 64k;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
