<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>北京交通大学教学支撑平台</title>
</head>
<body>
  <form action="" method="post" class="form-horizontal teaching-assessment-form" role="form">
    <input type="hidden" name="csrfmiddlewaretoken" value="csrf-token">
    <input type="hidden" name="refer" value="https://aa.bjtu.edu.cn/teaching_assessment/stu/list/">
    <input type="hidden" name="select-TOTAL_FORMS" value="2" id="id_select-TOTAL_FORMS">
    <input type="hidden" name="select-INITIAL_FORMS" value="2" id="id_select-INITIAL_FORMS">
    <input type="hidden" name="select-MIN_NUM_FORMS" value="0" id="id_select-MIN_NUM_FORMS">
    <input type="hidden" name="select-MAX_NUM_FORMS" value="1000" id="id_select-MAX_NUM_FORMS">
    <input type="hidden" name="multi-TOTAL_FORMS" value="0" id="id_multi-TOTAL_FORMS">
    <input type="hidden" name="multi-INITIAL_FORMS" value="0" id="id_multi-INITIAL_FORMS">
    <input type="hidden" name="multi-MIN_NUM_FORMS" value="0" id="id_multi-MIN_NUM_FORMS">
    <input type="hidden" name="multi-MAX_NUM_FORMS" value="1000" id="id_multi-MAX_NUM_FORMS">
    <input type="hidden" name="comment-TOTAL_FORMS" value="1" id="id_comment-TOTAL_FORMS">
    <input type="hidden" name="comment-INITIAL_FORMS" value="1" id="id_comment-INITIAL_FORMS">
    <input type="hidden" name="comment-MIN_NUM_FORMS" value="0" id="id_comment-MIN_NUM_FORMS">
    <input type="hidden" name="comment-MAX_NUM_FORMS" value="1000" id="id_comment-MAX_NUM_FORMS">

    <p>
      <label>1. 教师备课认真:</label>
      <div id="id_select-0-select_result" class="form-control">
        <div><label for="id_select-0-select_result_0"><input type="radio" name="select-0-select_result" value="1112" id="id_select-0-select_result_0">符合</label></div>
        <div><label for="id_select-0-select_result_1"><input type="radio" name="select-0-select_result" value="1113" id="id_select-0-select_result_1">基本符合</label></div>
        <div><label for="id_select-0-select_result_2"><input type="radio" name="select-0-select_result" value="1114" id="id_select-0-select_result_2">不符合</label></div>
        <div><label for="id_select-0-select_result_3"><input type="radio" name="select-0-select_result" value="1115" id="id_select-0-select_result_3">非常符合</label></div>
      </div>
      <input type="hidden" name="select-0-id" value="9001" id="id_select-0-id">
    </p>

    <p>
      <label>2. 综合评价:</label>
      <div id="id_select-1-select_result" class="form-control">
        <div><label for="id_select-1-select_result_0"><input type="radio" name="select-1-select_result" value="2112" id="id_select-1-select_result_0">优秀</label></div>
        <div><label for="id_select-1-select_result_1"><input type="radio" name="select-1-select_result" value="2113" id="id_select-1-select_result_1">良好</label></div>
        <div><label for="id_select-1-select_result_2"><input type="radio" name="select-1-select_result" value="2114" id="id_select-1-select_result_2">一般</label></div>
        <div><label for="id_select-1-select_result_3"><input type="radio" name="select-1-select_result" value="2115" id="id_select-1-select_result_3">差</label></div>
      </div>
      <input type="hidden" name="select-1-id" value="9002" id="id_select-1-id">
    </p>

    <p>
      <label>3. 主观意见:</label>
      <textarea name="comment-0-comment_result" cols="40" rows="5" id="id_comment-0-comment_result"></textarea>
      <input type="hidden" name="comment-0-id" value="9003" id="id_comment-0-id">
    </p>
    <button class="btn" type="submit">保存</button>
  </form>
</body>
</html>
