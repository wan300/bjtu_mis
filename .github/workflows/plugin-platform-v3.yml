name: Plugin platform v3 baseline

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  tooling:
    name: Contract generation, SDK, CLI and package determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin-tooling/package-lock.json
      - name: Install tooling dependencies
        working-directory: plugin-tooling
        run: npm ci
      - name: Reject generated contract drift
        working-directory: plugin-tooling
        run: npm run generate:check
      - name: Typecheck SDK and CLI
        working-directory: plugin-tooling
        run: npm run typecheck
      - name: Run SDK, CLI, Mock and generator tests
        working-directory: plugin-tooling
        run: npm test
      - name: Verify deterministic npm and plugin packages
        working-directory: plugin-tooling
        run: npm run pack:check
      - name: Verify shared schemas are byte-identical
        run: |
          cmp docs/third-party-service-manifest.schema.json web/assets/schemas/third-party-service-manifest.schema.json
          cmp docs/bjtu-marketplace.schema.json web/assets/schemas/bjtu-marketplace.schema.json
      - name: Lint contract_v1 source fixtures
        run: |
          node tools/third-party-service-lint.cjs plugin-tooling/packages/plugin-cli/template --source --marketplace --dev
          node tools/third-party-service-lint.cjs third-party-plugins/templates/basic --source --marketplace
          node tools/third-party-service-lint.cjs third-party-plugins/examples/profile-timetable --source --marketplace
          node tools/third-party-service-lint.cjs third-party-plugins/examples/remote-origin-demo --source --marketplace

  platform:
    name: Node 22 platform, schema, integration and e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bjtu_plugins
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: bjtu_plugins_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bjtu_plugins -d bjtu_plugins_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://bjtu_plugins:test-password@127.0.0.1:5432/bjtu_plugins_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/platform/package-lock.json
      - name: Install platform dependencies
        working-directory: web/platform
        run: npm ci
      - name: Typecheck
        working-directory: web/platform
        run: npm run typecheck
      - name: Unit tests
        working-directory: web/platform
        run: npm test
      - name: Verify production image contract inputs
        run: |
          docker build -f web/platform/Dockerfile -t bjtu-plugin-platform-ci .
          docker run --rm --entrypoint node bjtu-plugin-platform-ci -e '
            const lint = require("/repo/tools/third-party-service-lint.cjs");
            const result = { errors: [], warnings: [] };
            const schema = lint.loadManifestSchema("/repo", result);
            if (!schema || result.errors.length || schema.packageLimits.files <= 0) {
              throw new Error(result.errors.join("\n") || "contract package limits are invalid");
            }
          '
      - name: PostgreSQL migration and constraint tests
        working-directory: web/platform
        run: npm run test:integration
      - name: API e2e tests
        working-directory: web/platform
        run: npm run test:e2e
  android-jvm:
    name: Android JVM baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android/open-webui/package-lock.json
      - uses: gradle/actions/setup-gradle@v6
      - name: Run Android JVM tests
        working-directory: android
        run: ./gradlew test
      - name: Compile WebView instrumentation and release runtime
        working-directory: android
        run: ./gradlew :app:compileDebugAndroidTestKotlin :app:compileReleaseKotlin

  android-instrumentation:
    name: Android WebView instrumentation API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android/open-webui/package-lock.json
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run WebView security instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd android && ./gradlew :app:connectedDebugAndroidTest -PtargetAbis=x86_64
